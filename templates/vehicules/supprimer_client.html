<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supprimer un client - Garage Automobile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1d2d;
            color: white;
        }

        header {
            padding: 25px 40px;
            background-color: #142b40;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 600px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .confirmation {
            background-color: #142b40;
            padding: 35px;
            border-radius: 8px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
        }

        .client-info {
            margin: 25px 0;
            padding: 20px;
            background-color: #0f2639;
            border-radius: 6px;
        }

        .client-info p {
            margin: 10px 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        button,
        .btn-annuler {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        button {
            background-color: #d9534f;
            color: white;
        }

        .btn-annuler {
            background-color: #385872;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Garage Automobile</h1>
</header>

<main>

    <div class="confirmation">

        <h2>Supprimer le client</h2>

        <p>
            Êtes-vous sûr de vouloir supprimer ce client ?
        </p>

        <div class="client-info">

            <p>
                <strong>Nom :</strong>
                {{ client.nom }}
            </p>

            <p>
                <strong>Email :</strong>
                {{ client.email|default:"-" }}
            </p>

        </div>

        <form method="post">

            {% csrf_token %}

            <div class="buttons">

                <button type="submit">
                    Oui, supprimer
                </button>

                <a
                    href="{% url 'liste_clients' %}"
                    class="btn-annuler"
                >
                    Annuler
                </a>

            </div>

        </form>

    </div>

</main>

</body>
</html>
