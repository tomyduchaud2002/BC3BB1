<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modifier un client - Garage Automobile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1d2d;
            color: white;
        }

        header {
            padding: 25px 40px;
            background-color: #142b40;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .form-container {
            background-color: #142b40;
            padding: 35px;
            border-radius: 8px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #385872;
            border-radius: 6px;
            background-color: #0f2639;
            color: white;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button,
        .btn-retour {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        button {
            background-color: #269fe8;
            color: white;
        }

        .btn-retour {
            background-color: #385872;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Garage Automobile</h1>
</header>

<main>

    <div class="form-container">

        <h2>Modifier un client</h2>

        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label for="nom">
                    Nom
                </label>

                <input
                    type="text"
                    id="nom"
                    name="nom"
                    value="{{ client.nom }}"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ client.email }}"
                >

            </div>

            <div class="buttons">

                <button type="submit">
                    Enregistrer les modifications
                </button>

                <a
                    href="{% url 'liste_clients' %}"
                    class="btn-retour"
                >
                    Retour à la liste
                </a>

            </div>

        </form>

    </div>

</main>

</body>
</html>
