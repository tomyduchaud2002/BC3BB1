<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clients - Garage Automobile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1d2d;
            color: white;
        }

        header {
            padding: 25px 40px;
            background-color: #142b40;
        }

        header h1 {
            margin: 0;
        }

        main {
            padding: 40px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            background-color: #269fe8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #142b40;
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #28445c;
        }

        th {
            background-color: #1b3852;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-modifier {
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            background-color: #f0ad4e;
        }

        .btn-supprimer {
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            background-color: #d9534f;
        }

        .empty {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>Garage Automobile</h1>
</header>

<main>

    <div class="top">

        <h2>Liste des clients</h2>

        <a
            href="{% url 'ajouter_client' %}"
            class="btn"
        >
            Ajouter un client
        </a>

    </div>

    <table>

        <thead>
            <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for client in clients %}

                <tr>

                    <td>
                        {{ client.nom }}
                    </td>

                    <td>
                        {{ client.email|default:"-" }}
                    </td>

                    <td>

                        <div class="actions">

                            <a
                                href="{% url 'modifier_client' client.id %}"
                                class="btn-modifier"
                            >
                                Modifier
                            </a>

                            <a
                                href="{% url 'supprimer_client' client.id %}"
                                class="btn-supprimer"
                            >
                                Supprimer
                            </a>

                        </div>

                    </td>

                </tr>

            {% empty %}

                <tr>
                    <td colspan="3" class="empty">
                        Aucun client enregistré.
                    </td>
                </tr>

            {% endfor %}

        </tbody>

    </table>

</main>

</body>
</html>
