<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un véhicule</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #081b2b;
            color: white;
        }

        header {
            background: #132d44;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #132d44;
            border-radius: 12px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #397da8;
            border-radius: 6px;
            background: #0d263b;
            color: white;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #299bd6;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.85;
        }

        .retour {
            display: inline-block;
            margin-left: 10px;
            color: #5bbcff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Garage Automobile</h1>
</header>

<main>

    <h2>Modifier le véhicule</h2>

    <form method="post">
        {% csrf_token %}

        <label for="plaque">Plaque d'immatriculation</label>

        <input
            type="text"
            id="plaque"
            name="plaque"
            value="{{ vehicule.plaque }}"
            required
        >

        <label for="marque">Marque</label>

        <input
            type="text"
            id="marque"
            name="marque"
            value="{{ vehicule.marque }}"
            required
        >

        <label for="modele">Modèle</label>

        <input
            type="text"
            id="modele"
            name="modele"
            value="{{ vehicule.modele }}"
            required
        >

        <label for="annee">Année</label>

        <input
            type="number"
            id="annee"
            name="annee"
            value="{{ vehicule.annee|default_if_none:'' }}"
        >

        <label for="client">Client</label>

        <select id="client" name="client">

            <option value="">
                -- Aucun client --
            </option>

            {% for client in clients %}
                <option
                    value="{{ client.id }}"
                    {% if vehicule.client_id == client.id %}selected{% endif %}
                >
                    {{ client.nom }}
                </option>
            {% endfor %}

        </select>

        <button type="submit">
            Enregistrer les modifications
        </button>

        <a class="retour" href="{% url 'liste_vehicules' %}">
            Annuler
        </a>

    </form>

</main>

</body>
</html>
