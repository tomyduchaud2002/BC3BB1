<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un véhicule - Garage Automobile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1d2d;
            color: white;
        }

        header {
            padding: 25px 40px;
            background-color: #142b40;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-container {
            background-color: #142b40;
            padding: 30px;
            border-radius: 8px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #385872;
            border-radius: 6px;
            background-color: #0f2639;
            color: white;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button,
        .btn-retour {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background-color: #269fe8;
            color: white;
        }

        .btn-retour {
            background-color: #385872;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Garage Automobile</h1>
</header>

<main>

    <div class="form-container">

        <h2>Ajouter un véhicule</h2>

        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label for="plaque">Plaque d'immatriculation</label>
                <input
                    type="text"
                    id="plaque"
                    name="plaque"
                    required
                >
            </div>

            <div class="form-group">
                <label for="marque">Marque</label>
                <input
                    type="text"
                    id="marque"
                    name="marque"
                    required
                >
            </div>

            <div class="form-group">
                <label for="modele">Modèle</label>
                <input
                    type="text"
                    id="modele"
                    name="modele"
                    required
                >
            </div>

            <div class="form-group">
                <label for="annee">Année</label>
                <input
                    type="number"
                    id="annee"
                    name="annee"
                >
            </div>

            <div class="form-group">
                <label for="client">Client</label>

                <select id="client" name="client">
                    <option value="">-- Aucun client --</option>

                    {% for client in clients %}
                        <option value="{{ client.id }}">
                            {{ client.nom }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="buttons">
                <button type="submit">
                    Ajouter le véhicule
                </button>

                <a href="{% url 'liste_vehicules' %}" class="btn-retour">
                    Retour à la liste
                </a>
            </div>

        </form>

    </div>

</main>

</body>
</html>
