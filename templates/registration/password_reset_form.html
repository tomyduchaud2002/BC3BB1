{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mot de passe oublié — Garage Auto</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Garage Automobile</h1>
    <h2>Réinitialiser le mot de passe</h2>

    <form method="post" action="" class="auth-form">
      {% csrf_token %}
      <label for="id_email">Adresse e‑mail</label>
      {{ form.email }}
      <button type="submit" class="btn-primary">Envoyer le lien</button>
    </form>
    <p style="margin-top:1rem"><a href="{% url 'login' %}">Retour à la connexion</a></p>
  </main>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
