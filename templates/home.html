<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Automobile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #081b2b;
            color: white;
        }

        header {
            background: #132d44;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 1000px;
            margin: 60px auto;
            padding: 20px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 50px;
        }

        .welcome h2 {
            font-size: 30px;
        }

        .welcome p {
            color: #b8c7d6;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .card {
            background: #132d44;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
        }

        .card h3 {
            font-size: 24px;
            margin-top: 0;
        }

        .card p {
            color: #b8c7d6;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 6px;
            background: #299bd6;
            color: white;
            text-decoration: none;
        }

        .button:hover {
            opacity: 0.85;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            header {
                padding: 20px;
            }

            main {
                margin: 30px auto;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Garage Automobile</h1>

    <a href="{% url 'logout' %}">
        Se déconnecter
    </a>
</header>

<main>

    <section class="welcome">
        <h2>Bienvenue {{ user.username }} 👋</h2>
        <p>
            Gestion du garage automobile
        </p>
    </section>

    <section class="cards">

        <div class="card">
            <h3>🚗 Véhicules</h3>

            <p>
                Gérer les véhicules enregistrés dans le garage.
            </p>

            <div class="buttons">
                <a class="button" href="{% url 'liste_vehicules' %}">
                    Liste des véhicules
                </a>

                <a class="button" href="{% url 'ajouter_vehicule' %}">
                    Ajouter
                </a>
            </div>
        </div>

        <div class="card">
            <h3>👤 Clients</h3>

            <p>
                Gérer les clients du garage.
            </p>

            <div class="buttons">
                <a class="button" href="{% url 'liste_clients' %}">
                    Liste des clients
                </a>

                <a class="button" href="{% url 'ajouter_client' %}">
                    Ajouter
                </a>
            </div>
        </div>

    </section>

</main>

</body>
</html>
